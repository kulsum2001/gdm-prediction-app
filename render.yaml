services:
  - type: web
    name: gdm-prediction-app
    runtime: python
    plan: free
    buildCommand: pip install -r web_app/requirements.txt
    startCommand: cd web_app && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
