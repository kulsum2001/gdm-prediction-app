<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 text-teal-600">Assessment History</h1>
        {% if history %}
            {{ history | safe }}
        {% else %}
            <p class="text-center text-gray-500">No history available.</p>
        {% endif %}
        <div class="mt-4 text-center">
            <a href="{{ url_for('index') }}" class="bg-teal-500 text-white p-2 rounded-md hover:bg-teal-600">Back to Assessment</a>
        </div>
    </div>
</body>
</html>
